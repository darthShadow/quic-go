# CI for the shunpike patches on this fork. Upstream's workflows are disabled
# here; this one tests what the fork adds and what shunpike needs from it.
name: Fork CI

on:
  push:
    branches-ignore: [upstream-master]
    tags: ["v*-shunpike.*"]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOWORK: "off"

jobs:
  patched-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet . ./internal/ackhandler/... ./internal/congestion/... ./internal/protocol/... ./integrationtests/self/...
      - run: go test -race -timeout 20m -shuffle=on . ./internal/ackhandler/... ./internal/congestion/... ./internal/protocol/...
      - run: go test -race -timeout 10m -shuffle=on ./integrationtests/self -version=1

  shunpike:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fork
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: darthShadow/shunpike
          ref: main
          path: shunpike
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: shunpike/go.mod
      - name: Point shunpike at this commit
        working-directory: shunpike
        run: go mod edit -replace github.com/quic-go/quic-go=../fork && go mod tidy
      - working-directory: shunpike
        run: go test -race ./...
